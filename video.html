<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>LifeGuard App Demo</title><style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #080d1c;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.container {
    width: 100%;
    max-width: 500px;
    text-align: center;
    background: #111a30;
    padding: 22px;
    border-radius: 20px;
    border: 1px solid #263b61;
}

h1 {
    color: #55aaff;
    font-size: 25px;
}

p {
    color: #b8c7df;
    line-height: 1.6;
}

.video-wrapper {
    width: 100%;
    display: flex;
    justify-content: center;
    margin-top: 15px;
}

video {
    width: 100%;
    max-width: 360px;
    aspect-ratio: 9 / 16;
    object-fit: contain;
    border-radius: 14px;
    background: #000;
}

.error {
    display: none;
    color: #ff7777;
    margin-top: 15px;
    font-size: 14px;
}

.download-link {
    display: inline-block;
    margin-top: 12px;
    color: #55aaff;
    text-decoration: underline;
}

.home-btn {
    display: inline-block;
    margin-top: 20px;
    padding: 12px 22px;
    background: #1677ff;
    color: white;
    text-decoration: none;
    border-radius: 10px;
}
</style></head><body><div class="container"><h1>🛡️ LifeGuard</h1><p>Watch the LifeGuard Smart Life Organizer App Demo</p><div class="video-wrapper"><video id="lifeGuardVideo"
controls
playsinline
preload="metadata">

<source
src="https://shubh499-dev.github.io/Lifeguard-site/videos/lifeguard-demo.mp4"
type="video/mp4">

Your browser does not support HTML5 video.

</video></div><div id="videoError" class="error">
Sorry! Video could not be loaded.
Please check your internet connection or try again.
<br>
<a class="download-link"
href="https://shubh499-dev.github.io/Lifeguard-site/videos/lifeguard-demo.mp4">
Open Video Directly
</a>
</div><p>Organize Your Life. Never Miss What Matters!</p><a class="home-btn" href="./">Back to Website</a>

</div><script>
const video = document.getElementById("lifeGuardVideo");
const errorMessage = document.getElementById("videoError");

video.addEventListener("error", function() {
    errorMessage.style.display = "block";
});

video.addEventListener("loadeddata", function() {
    errorMessage.style.display = "none";
});
</script></body>
</html>
